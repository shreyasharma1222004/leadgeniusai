<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="DealFlow AI">
  <!-- DealFlow AI icon: pipeline channels merging into one forward arrow. -->
  <rect width="512" height="512" rx="112" fill="#191713"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#F5F3EE" stroke-opacity="0.14" stroke-width="2"/>

  <defs>
    <mask id="df-cut">
      <rect width="512" height="512" fill="white"/>
      <rect x="148" y="128" width="268" height="18" fill="black"/>
      <rect x="96" y="252" width="130" height="18" fill="black"/>
      <rect x="96" y="330" width="130" height="18" fill="black"/>
      <rect x="96" y="448" width="130" height="18" fill="black"/>
    </mask>
  </defs>

  <!-- Inbound flows entering from the left edge -->
  <rect x="32" y="128" width="100" height="18" fill="#F5F3EE" opacity="0.45"/>
  <rect x="32" y="376" width="100" height="18" fill="#F5F3EE" opacity="0.45"/>

  <!-- Converging channel: four lanes funneling right, masked into one slab -->
  <rect x="148" y="128" width="268" height="340" fill="#F5F3EE" opacity="0.16" mask="url(#df-cut)"/>

  <!-- Upper flow line: in at y=128, bends down to the arrow's entry -->
  <path d="M132 119 h84 a10 10 0 0 1 10 10 v123 a10 10 0 0 0 10 10 h40"
        fill="none" stroke="#F5F3EE" stroke-opacity="0.7" stroke-width="18" stroke-linecap="round"/>
  <!-- Lower flow line: in at y=385, bends up to the arrow's entry -->
  <path d="M132 394 h84 a10 10 0 0 0 10 -10 v-123 a10 10 0 0 1 10 -10 h40"
        fill="none" stroke="#F5F3EE" stroke-opacity="0.7" stroke-width="18" stroke-linecap="round"/>

  <!-- Forward arrow: one lane advancing to the right edge -->
  <path d="M266 322 h128 l-44 -44 M394 322 l-44 44"
        fill="none" stroke="#F5F3EE" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Flow origin node -->
  <rect x="96" y="376" width="18" height="18" fill="#F5F3EE" opacity="0.45"/>
</svg>
